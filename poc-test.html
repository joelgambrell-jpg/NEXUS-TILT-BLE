<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>ARC POC Test Runner</title><style>:root{color-scheme:dark;--bg:#050505;--panel:#111317;--text:#f5f5f5;--muted:#9ca1a8;--red:#d7131a;--green:#168c49;--amber:#e6a31a}*{box-sizing:border-box}body{margin:0;background:#050505;color:var(--text);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #5c0c10;padding-bottom:14px;margin-bottom:18px}.head img{width:170px}.build{font-weight:900;color:#ff3b42}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:linear-gradient(180deg,#16181b,#0b0c0e);border:1px solid #303238;border-radius:14px;padding:18px;margin-bottom:18px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:800}.field input,.field textarea{width:100%;min-height:48px;border:1px solid #34373d;border-radius:9px;padding:10px 12px;background:#090a0b;color:#fff}.field textarea{min-height:80px}button{min-height:52px;border-radius:10px;border:1px solid transparent;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:var(--red);color:white}.secondary{background:#25282d;color:white}.good{background:var(--green);color:white}.bad{background:#ce171f;color:white}.warn{background:var(--amber);color:#111}.wide{width:100%}.status{margin-top:12px;padding:14px;border-radius:10px;background:#1b1e22;border:1px solid #292d32;font-weight:800}.point{text-align:center;font-size:58px;font-weight:900;padding:28px 10px;border:1px solid #34373d;border-radius:14px;background:#08090a;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1}.candidate{font-size:24px;text-align:center}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:40px 1fr auto;gap:10px;padding:10px;border:1px solid #303238;border-radius:9px}.done{border-color:#245d3a}.muted{color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.head{align-items:flex-start}.head img{width:130px}.point{font-size:46px}}</style></head><body><div class="wrap"><div class="head"><div><img src="assets/arc-header.svg" alt="ARC Systems"><div class="muted">If you can see it, we can track it.</div></div><div class="build">SELF-CONTAINED BUILD v27</div></div><div class="grid"><section class="card"><h2>TEST SETUP</h2><div class="field"><label>Project Name *</label><input id="project"></div><div class="field"><label>Equipment ID *</label><input id="equipment"></div><div class="field"><label>Equipment Type *</label><input id="type"></div><div class="field"><label>Tester Name *</label><input id="tester"></div><div class="field"><label>Calibration / Tool ID *</label><textarea id="cal"></textarea></div><button id="open" class="primary wide">OPEN TEST</button><div id="openStatus" class="status">Ready.</div></section><section class="card"><h2>DEVICE CONNECTION</h2><div id="bleStatus" class="status">No ARC device connected.</div><div class="row"><button id="connect" class="primary">CONNECT ARC DEVICE</button><button id="disconnect" class="secondary">DISCONNECT</button></div><p class="muted">Chrome should open its Bluetooth chooser directly from CONNECT ARC DEVICE.</p></section></div><section class="card"><h2>RUN TEST</h2><div id="counter" class="status">NOT STARTED</div><div id="point" class="point">—</div><div id="candidate" class="status candidate" hidden></div><div id="decisions" class="row" hidden><button id="accept" class="good">ACCEPT</button><button id="reject" class="bad">REJECT / RETEST</button></div><h3>POC SIMULATOR</h3><div class="row"><button class="warn sim" data-ch="OPEN">SIMULATE OPEN</button><button class="bad sim" data-ch="SHORT">SIMULATE SHORT</button><button class="good sim" data-ch="TRANSFORMER_OK">SIMULATE TRANSFORMER OK</button></div><div id="list" class="list"></div></section></div><script>(function(){'use strict';const $=id=>document.getElementById(id);const tests=['A-B','A-C','B-C','A-G','B-G','C-G','A-N','B-N','C-N','N-G'];let index=-1,candidate=null,accepted=[],device=null;function render(){const running=index>=0&&index<tests.length;$('counter').textContent=index<0?'NOT STARTED':index>=tests.length?'COMPLETE':(index+1)+' / '+tests.length;$('point').textContent=index<0?'—':index>=tests.length?'COMPLETE':tests[index];$('candidate').hidden=!candidate;$('decisions').hidden=!candidate;if(candidate)$('candidate').textContent=candidate+' DETECTED';$('list').innerHTML=tests.map((t,i)=>'<div class="item '+(accepted[i]?'done':'')+'"><strong>'+(i+1)+'</strong><span>'+t+'</span><span>'+(accepted[i]||'WAITING')+'</span></div>').join('');}function openTest(){const missing=[];[['project','Project Name'],['equipment','Equipment ID'],['type','Equipment Type'],['tester','Tester Name'],['cal','Calibration / Tool ID']].forEach(([id,name])=>{if(!$(id).value.trim())missing.push(name)});if(missing.length){$('openStatus').textContent='Missing: '+missing.join(', ');return}accepted=[];candidate=null;index=0;$('openStatus').textContent='TEST OPEN — perform A-B.';render()}function receive(ch){if(index<0||index>=tests.length){$('openStatus').textContent='Open a test first.';return}if(candidate)return;candidate=ch;render()}function accept(){if(!candidate)return;accepted[index]=candidate;candidate=null;index++;$('openStatus').textContent=index>=tests.length?'TEST COMPLETE.':'Accepted. Next: '+tests[index];render()}function reject(){candidate=null;$('openStatus').textContent='Reading rejected. Retest '+tests[index]+'.';render()}async function connect(){try{if(!window.isSecureContext)throw new Error('Chrome requires HTTPS.');if(!navigator.bluetooth)throw new Error('Web Bluetooth is not available in this Chrome session.');$('bleStatus').textContent='Opening Chrome Bluetooth chooser...';device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['8f4d0001-7b6a-4f4b-8f44-4e4558555354']});$('bleStatus').textContent='Selected: '+(device.name||'Unnamed Bluetooth device')+' — attempting ARC service connection...';const server=await device.gatt.connect();const service=await server.getPrimaryService('8f4d0001-7b6a-4f4b-8f44-4e4558555354');const characteristic=await service.getCharacteristic('8f4d0002-7b6a-4f4b-8f44-4e4558555354');await characteristic.startNotifications();characteristic.addEventListener('characteristicvaluechanged',e=>{try{const txt=new TextDecoder().decode(e.target.value);const obj=JSON.parse(txt);if(obj.channel)receive(obj.channel)}catch(err){$('bleStatus').textContent='BLE EVENT ERROR: '+err.message}});$('bleStatus').textContent='ARC DEVICE CONNECTED: '+(device.name||'device')}catch(err){$('bleStatus').textContent='CONNECT ERROR: '+(err&&err.message?err.message:String(err));console.error(err)}}function disconnect(){try{if(device&&device.gatt&&device.gatt.connected)device.gatt.disconnect()}catch(e){}device=null;$('bleStatus').textContent='ARC device disconnected.'}$('open').addEventListener('click',openTest);$('accept').addEventListener('click',accept);$('reject').addEventListener('click',reject);$('connect').addEventListener('click',connect);$('disconnect').addEventListener('click',disconnect);document.querySelectorAll('.sim').forEach(b=>b.addEventListener('click',()=>receive(b.dataset.ch)));render();$('openStatus').textContent='SELF-CONTAINED ARC v27 READY · '+(window.isSecureContext?'HTTPS OK':'NOT SECURE');})();</script></body></html>
